[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maha-these"
version = "0.1.0"
description = "Environnement Python pour data science et IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
  "pyarrow>=16,<21",
  "polars>=1.0,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "plotly>=5.22,<7",
  "statsmodels>=0.14,<1",
  "jupyterlab>=4.2,<5",
  "notebook>=7.2,<8",
  "ipykernel>=6.29,<7",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "tqdm>=4.66,<5",
  "rich>=13.7,<14",
  "joblib>=1.4,<2",
  "fastapi>=0.112,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "black>=24.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pre-commit>=3.7",
]

ai = [
  "optuna>=3.6,<5",
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "mlflow>=2.15,<4",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "torchaudio>=2.3,<3",
  # transformers <4.46 : compat trl 0.11 + huggingface-hub <1.0 (validé GPU).
  "transformers>=4.43,<4.46",
  "huggingface-hub>=0.24,<1.0",
  "protobuf>=3.20,<6",
  "datasets>=2.20,<4",
  "accelerate>=0.33,<2",
  # QLoRA 4-bit (GPU NVIDIA). Sous macOS : ignorer.
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "evaluate>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "catboost>=1.2,<2",
  # Fine-tuning fédéré LLM + LoRA
  "peft>=0.11,<1",
  "trl>=0.9,<1",
  # Recommandation & métriques profil
  "sentence-transformers>=3.0,<4",
  "rouge-score>=0.1,<1",
]

# Couche 1 — crawling multi-plateformes
crawl = [
  "praw>=7.7,<8",
  "playwright>=1.45,<2",
  "beautifulsoup4>=4.12,<5",
]

# Store de profils partagé RAM-only (multi-process/workers) — optionnel
redis = [
  "redis>=5,<6",
]

# Couche 5 — dashboard : voir frontend/ (React + Vite, géré par npm).

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
