name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pile légère : outils dev + crawling (bs4/praw/playwright).
          # La pile ML lourde ([ai]) n'est pas installée en CI : les tests
          # qui en dépendent (torch) sont automatiquement "skipped".
          pip install -e ".[dev,crawl]"

      - name: Lint (ruff)
        run: ruff check src evaluation tests

      - name: Format check (black)
        run: black --check src evaluation tests

      - name: Run tests
        run: pytest -q --cov=maha_these --cov-report=term-missing
